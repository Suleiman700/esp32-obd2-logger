<text x="42" y="632" font-size="14" fill="#111" text-anchor="start">Notes</text>
<text x="42" y="656" font-size="12" fill="#333" text-anchor="start">• Set the LM2596 to 5.0 V BEFORE connecting the ESP32.</text>
<text x="42" y="676" font-size="12" fill="#333" text-anchor="start">• Never connect OBD pin 16 (+12 V) straight to the ESP32.</text>
<text x="42" y="696" font-size="12" fill="#333" text-anchor="start">• All GND symbols / black wires = the same ESP32 GND.</text>
<text x="42" y="716" font-size="12" fill="#333" text-anchor="start">• SDO (MISO) left unconnected: it can block the touch chip.</text>
<text x="42" y="736" font-size="12" fill="#333" text-anchor="start">• Button: internal pull-up, no resistor (4-leg: use diagonals).</text>
<text x="42" y="756" font-size="12" fill="#333" text-anchor="start">• 3-pin buzzer module: VCC → 3V3, I/O → D25, GND → GND.</text>
